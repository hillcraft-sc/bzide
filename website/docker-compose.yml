# Run from the website folder: docker compose up -d --build
# cloudflared reaches it as http://bzide-website:8080 (see README.md).
services:
  bzide-website:
    build:
      context: ..
      dockerfile: website/Dockerfile
    image: bzide-website
    container_name: bzide-website
    # No published port: only containers on cloudflared's network can reach
    # it, so visitors always come through the tunnel.
    networks:
      - tunnel
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

networks:
  # cloudflared's network, created outside this file.
  tunnel:
    external: true
